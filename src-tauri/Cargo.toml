[package]
name = "next-data-analyzer"
version = "0.1.0"
description = "Next Data Analyzer - portable data profiling desktop app"
authors = ["you"]
edition = "2021"

[lib]
name = "next_data_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
panic = "abort"
